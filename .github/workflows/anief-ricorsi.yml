name: Sync ANIEF Ricorsi

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape ANIEF ricorsi
        run: npm run sync

      - name: Validate feed
        run: node -e "const x=require('./ricorsi.json'); if(!Array.isArray(x.items)) process.exit(1); console.log('Ricorsi:',x.items.length)"

      - name: Commit updated feed
        run: |
          git config user.name "anief-ricorsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ricorsi.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica al feed"
          else
            git commit -m "Update ANIEF ricorsi feed"
            git push
          fi
