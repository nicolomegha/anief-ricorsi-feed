name: Sync ANIEF Ricorsi
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run sync
      - name: Publish feed
        run: |
          git config user.name "anief-ricorsi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ricorsi.json
          git diff --cached --quiet || git commit -m "Update ANIEF ricorsi feed"
          git push
